[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ytpulse"
version = "0.1.0"
description = "Live-chat and comment sentiment, entity and name-count pipeline for YouTube."
requires-python = ">=3.10"
dependencies = [
  "requests>=2.31",
  "PyYAML>=6",
  "pandas>=2.0",
  "numpy>=1.26",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
ml = ["transformers>=4.40", "torch", "sentencepiece>=0.2.0,<0.2.3", "protobuf"]
dev = ["pytest"]

[project.scripts]
ytpulse = "ytpulse.cli:main"

[tool.setuptools.packages.find]
include = ["ytpulse*"]

[tool.setuptools.package-data]
ytpulse = ["data/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
